<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SagaSmithAI — Worlds remember. Rules settle.</title>
  <desc id="desc">Local Agent Kit and SagaSmith Web connect to one authoritative MCP contract for D&amp;D, Call of Cthulhu, and Narrative.</desc>
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#eee9dc" stroke-opacity=".035"/>
    </pattern>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(236 68) rotate(38) scale(590 390)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d9ad5b" stop-opacity=".22"/>
      <stop offset="1" stop-color="#d9ad5b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="630" fill="#0c0d0d"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g transform="translate(72 58)">
    <rect width="44" height="44" rx="10" fill="#0c0d0d" stroke="#d9ad5b" stroke-width="2"/>
    <path d="M29 12c-3-2-7-4-11-4-7 0-12 4-12 9s5 7 12 9c7 2 11 3 11 8 0 4-4 7-10 7-6 0-11-2-15-6" transform="translate(5 -2) scale(.82)" fill="none" stroke="#eee9dc" stroke-width="4" stroke-linecap="round"/>
    <text x="60" y="33" fill="#eee9dc" font-family="Georgia, 'Noto Serif SC', serif" font-size="34" font-weight="600">SagaSmith</text>
    <text x="244" y="33" fill="#d9ad5b" font-family="Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2">AI</text>
    <text x="956" y="29" fill="#9fbd98" font-family="Consolas, monospace" font-size="11" font-weight="700" text-anchor="end" letter-spacing="1.5">ACTIVE ALPHA</text>
  </g>

  <g transform="translate(72 154)">
    <text fill="#d9ad5b" font-family="Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2.5">AI-NATIVE TTRPG PLATFORM</text>
    <text y="74" fill="#eee9dc" font-family="Georgia, 'Noto Serif SC', serif" font-size="58" font-weight="500">Worlds remember.</text>
    <text y="136" fill="#d9ad5b" font-family="Georgia, 'Noto Serif SC', serif" font-size="58" font-weight="500">Rules settle.</text>
    <text y="180" fill="#96998f" font-family="Inter, 'Segoe UI', sans-serif" font-size="18">让世界记得，让规则落槌。</text>
  </g>

  <g transform="translate(602 156)" filter="url(#shadow)">
    <rect width="526" height="360" rx="16" fill="#151716" stroke="#343735"/>
    <text x="22" y="31" fill="#96998f" font-family="Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1.5">DEPLOYMENT MAP / v1</text>
    <text x="504" y="31" fill="#9fbd98" font-family="Consolas, monospace" font-size="9" font-weight="700" text-anchor="end">CONTRACT LOCKED</text>
    <path d="M22 46H504" stroke="#343735"/>

    <g transform="translate(22 68)">
      <rect width="198" height="94" rx="10" fill="#1b1e1c" stroke="#343735"/>
      <text x="14" y="23" fill="#d9ad5b" font-family="Consolas, monospace" font-size="8" font-weight="700">LOCAL / YOU OPERATE</text>
      <text x="14" y="52" fill="#eee9dc" font-family="Georgia, serif" font-size="22">Local Agent Kit</text>
      <text x="14" y="75" fill="#96998f" font-family="Inter, sans-serif" font-size="10">stdio · localhost HTTP · local data</text>

      <rect y="112" width="198" height="94" rx="10" fill="#1b1e1c" stroke="#343735"/>
      <text x="14" y="135" fill="#d9ad5b" font-family="Consolas, monospace" font-size="8" font-weight="700">HOSTED / WEB PRODUCT</text>
      <text x="14" y="164" fill="#eee9dc" font-family="Georgia, serif" font-size="22">SagaSmith Web</text>
      <text x="14" y="187" fill="#96998f" font-family="Inter, sans-serif" font-size="10">browser · API/BFF · Agent worker</text>

      <path d="M198 103H230M214 47V159" stroke="#d9ad5b"/>
      <rect x="207" y="96" width="14" height="14" fill="#0c0d0d" stroke="#d9ad5b" transform="rotate(45 214 103)"/>

      <rect x="230" width="252" height="94" rx="10" fill="#d9ad5b"/>
      <text x="246" y="22" fill="#3c311d" font-family="Consolas, monospace" font-size="8" font-weight="700">ONE AUTHORITATIVE CONTRACT</text>
      <text x="246" y="49" fill="#17140f" font-family="Consolas, monospace" font-size="12" font-weight="700">sagasmith.authoritative-mcp/v1</text>
      <text x="246" y="70" fill="#3c311d" font-family="Inter, sans-serif" font-size="10">schemas · errors · authority · revisions</text>

      <g transform="translate(230 112)">
        <rect width="78" height="94" rx="9" fill="#101211" stroke="#343735"/>
        <rect x="87" width="78" height="94" rx="9" fill="#101211" stroke="#343735"/>
        <rect x="174" width="78" height="94" rx="9" fill="#101211" stroke="#343735"/>
        <text x="39" y="40" fill="#9fbd98" font-family="Consolas, monospace" font-size="8" text-anchor="middle">DOMAIN</text>
        <text x="39" y="66" fill="#eee9dc" font-family="Georgia, serif" font-size="18" text-anchor="middle">D&amp;D</text>
        <text x="126" y="40" fill="#9fbd98" font-family="Consolas, monospace" font-size="8" text-anchor="middle">DOMAIN</text>
        <text x="126" y="66" fill="#eee9dc" font-family="Georgia, serif" font-size="18" text-anchor="middle">CoC</text>
        <text x="213" y="40" fill="#9fbd98" font-family="Consolas, monospace" font-size="8" text-anchor="middle">DOMAIN</text>
        <text x="213" y="66" fill="#eee9dc" font-family="Georgia, serif" font-size="13" text-anchor="middle">Narrative</text>
      </g>
    </g>
    <rect x="22" y="298" width="482" height="40" rx="7" fill="#101211" stroke="#2a2d2b"/>
    <text x="38" y="323" fill="#96998f" font-family="Consolas, monospace" font-size="9">LOCAL + HOSTED</text>
    <text x="488" y="323" fill="#d9ad5b" font-family="Consolas, monospace" font-size="9" text-anchor="end">ONE DOMAIN TRUTH</text>
  </g>

  <path d="M72 554H1128" stroke="#343735"/>
  <text x="72" y="588" fill="#96998f" font-family="Consolas, monospace" font-size="11" letter-spacing="1.5">sagasmithai.github.io</text>
  <text x="1128" y="588" fill="#9fbd98" font-family="Consolas, monospace" font-size="11" text-anchor="end">LOCAL · HOSTED · AUTHORITATIVE</text>
</svg>
